name: Build APK

on:
  workflow_dispatch:        # tombol "Run workflow" di tab Actions
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Perbarui data dari keterangan.xlsx dan folder foto
        run: |
          pip install openpyxl
          python update.py

      - name: Pasang dependensi
        run: npm install

      - name: Buat proyek Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Nomor versi otomatis
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Pakai kunci tanda tangan tetap (agar APK baru bisa menimpa yang lama)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Bangun APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Ganti nama file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KodeBMN.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KodeBMN-apk
          path: KodeBMN.apk
          retention-days: 30
